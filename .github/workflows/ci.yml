name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://x:x@x:5432/x
        run: npx prisma generate

      - name: Lint (advisory — pre-existing errors, non-blocking)
        run: npm run lint || true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          DATABASE_URL: postgresql://x:x@x:5432/x
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build


  docker:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Only a push to the default branch may publish an artifact. Pull
          # requests still build both images as a verification gate, but push
          # nothing to the registry.
          if [ "${{ github.event_name }}" = "push" ] && \
             { [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to container registry
        # Skipped on pull requests — there is nothing to push there.
        if: steps.vars.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.vars.outputs.publish == 'true' }}
          # `latest` is the convenience tag; the SHA tag is what deploys pin to.
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_short }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app,ignore-error=true

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: ${{ steps.vars.outputs.publish == 'true' }}
          tags: |
            ${{ steps.vars.outputs.image }}-migrator:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator,ignore-error=true

      - name: Report release coordinates
        if: steps.vars.outputs.publish == 'true'
        run: |
          echo "::notice title=Published::${GITHUB_REPOSITORY,,}@${{ steps.vars.outputs.sha_short }} is available on GHCR."
          {
            echo "### Published to GHCR"
            echo ""
            echo "- app:       \`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_short }}\`"
            echo "- migrator:  \`${{ steps.vars.outputs.image }}-migrator:${{ steps.vars.outputs.sha_short }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
